name: Deploy Angular app to GitHub Pages

on:
  push:
    branches:
      - feature/Converter1.0.0
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Remove tracked local dependencies
        run: rm -rf converter/node_modules

      - name: Install dependencies
        working-directory: converter
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build Angular app
        working-directory: converter
        run: npm run build -- --configuration production --base-href /Converter/

      - name: Publish build to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: converter/dist/converter
          force_orphan: true